[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "musa-margin-nowcast"
version = "0.1.0"
description = "A transparent, uncertainty-aware nowcast for Murphy USA fuel margins"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "MUSA margin tracker contributors"}]
dependencies = ["lxml>=5", "requests>=2.31", "websocket-client>=1.8", "xlrd>=2.0"]

[project.optional-dependencies]
cloud = ["google-cloud-storage>=2.18,<4"]

[project.scripts]
musa-nowcast = "musa_nowcast.cli:main"
musa-fetch-eia = "musa_nowcast.eia:main"
musa-rin = "musa_nowcast.rin:main"
musa-geo = "musa_nowcast.geo:main"
musa-timing = "musa_nowcast.timing:main"
musa-shadow = "musa_nowcast.shadow:main"
musa-eps-bridge = "musa_nowcast.eps_bridge:main"
musa-risk = "musa_nowcast.risk:main"
musa-risk-ledger = "musa_nowcast.risk_ledger:main"
musa-uncertain-quarter = "musa_nowcast.uncertain_quarter:main"
musa-prospective = "musa_nowcast.prospective:main"
musa-daily-capture = "musa_nowcast.daily_capture:main"
musa-daily-prices = "musa_nowcast.daily_prices:main"
musa-couchetard-peer = "musa_nowcast.couchetard_peer:main"
musa-alt-experiments = "musa_nowcast.alternative_experiments:main"
musa-futures-scenarios = "musa_nowcast.futures_scenarios:main"

[tool.setuptools]
packages = ["musa_nowcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
